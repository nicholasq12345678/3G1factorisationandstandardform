<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Snakes & Ladders Multiplayer</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Confetti for winning celebration -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        .board-grid {
            display: grid;
            grid-template-columns: repeat(10, minmax(0, 1fr));
            grid-template-rows: repeat(10, minmax(0, 1fr));
        }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(-1deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            80% { transform: translate(1px, -1px) rotate(1deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .dice-shake {
            animation: shake 0.5s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col items-center justify-start p-4">

    <!-- Header -->
    <header class="mb-6 text-center">
        <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400">
            Math Snakes & Ladders
        </h1>
        <p class="text-slate-400 text-sm mt-1">Roll 2 dice, answer algebra & standard form questions correctly to climb higher!</p>
    </header>

    <!-- Setup / Lobby Screen -->
    <div id="lobby-screen" class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-2xl">
        <h2 class="text-2xl font-bold mb-4 text-emerald-400">Game Lobby</h2>
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Your Name</label>
                <input type="text" id="player-name-input" placeholder="e.g. Alex" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Room Code</label>
                <input type="text" id="room-code-input" placeholder="e.g. math123" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-emerald-500 uppercase">
            </div>
            <div class="flex gap-3 pt-2">
                <button onclick="joinGame()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 font-semibold py-2 px-4 rounded-lg transition text-white">Join / Create Room</button>
            </div>
        </div>
    </div>

    <!-- Main Game Screen (Hidden Initially) -->
    <div id="game-screen" class="w-full max-w-6xl hidden flex flex-col lg:flex-row gap-6">
        
        <!-- Left: Board & Visuals -->
        <div class="flex-1 flex flex-col items-center relative">
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-2xl relative w-full max-w-[600px] aspect-square">
                <!-- SVG Overlay for Snakes & Ladders -->
                <svg id="board-svg" class="absolute inset-4 w-[calc(100%-2rem)] h-[calc(100%-2rem)] pointer-events-none z-10"></svg>
                <!-- 10x10 Grid -->
                <div id="board-grid" class="board-grid w-full h-full relative z-0"></div>
            </div>
        </div>

        <!-- Right: Control Panel & Status -->
        <div class="w-full lg:w-96 flex flex-col gap-4">
            
            <!-- Room Info & Players List -->
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-lg">
                <div class="flex justify-between items-center mb-3">
                    <span class="text-sm font-semibold text-slate-400">Room: <span id="display-room-code" class="text-emerald-400 font-mono"></span></span>
                    <span id="turn-indicator" class="text-xs px-2.5 py-1 rounded-full bg-cyan-900 text-cyan-300 font-bold">Waiting...</span>
                </div>
                <h3 class="text-sm font-bold text-slate-300 mb-2">Players</h3>
                <div id="players-list" class="space-y-2 max-h-36 overflow-y-auto"></div>
            </div>

            <!-- Dice Roller Box -->
            <div id="dice-section" class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-lg flex flex-col items-center">
                <h3 class="text-sm font-bold text-slate-300 mb-3">Double Dice Roll</h3>
                <div class="flex gap-4 mb-4">
                    <div id="dice-1" class="w-16 h-16 bg-slate-900 border-2 border-emerald-500 rounded-xl flex items-center justify-center text-3xl font-black text-emerald-400 shadow-inner">?</div>
                    <div id="dice-2" class="w-16 h-16 bg-slate-900 border-2 border-emerald-500 rounded-xl flex items-center justify-center text-3xl font-black text-emerald-400 shadow-inner">?</div>
                </div>
                <button id="roll-btn" onclick="rollDice()" disabled class="w-full bg-slate-700 text-slate-400 font-bold py-2.5 px-4 rounded-lg cursor-not-allowed transition">Roll Dice</button>
            </div>

            <!-- Game Log -->
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-lg flex-1 flex flex-col">
                <h3 class="text-sm font-bold text-slate-300 mb-2">Activity Log</h3>
                <div id="activity-log" class="bg-slate-900/50 border border-slate-800 rounded-lg p-3 h-36 overflow-y-auto text-xs space-y-1.5 font-mono text-slate-300"></div>
            </div>

        </div>
    </div>

    <!-- Question Modal Overlay -->
    <div id="question-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-lg w-full p-6 shadow-2xl flex flex-col gap-4">
            <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                <h3 class="text-lg font-bold text-emerald-400" id="q-modal-title">Math Challenge!</h3>
                <span id="q-timer" class="text-xs font-mono bg-amber-500/20 text-amber-400 border border-amber-500/30 px-2 py-1 rounded">Time: 30s</span>
            </div>
            <div>
                <p id="q-text" class="text-base font-medium text-slate-100 mb-4"></p>
                <div id="q-options" class="grid grid-cols-1 gap-2.5"></div>
            </div>
        </div>
    </div>

    <!-- Game Script Logic -->
    <script>
        // Question Bank Loaded from User Data
        const questionBank = [
            { q: "Factorise 3x + 3", options: ["3(x+1)", "3(x-1)", "x(3+3)", "3x(1+1)"], answer: "3(x+1)" },
            { q: "Factorise 5x - 20", options: ["5(x-4)", "5(x+4)", "4(x-5)", "5x(1-4)"], answer: "5(x-4)" },
            { q: "Factorise 3x - 33", options: ["3(x-11)", "3(x+11)", "11(x-3)", "3x(1-11)"], answer: "3(x-11)" },
            { q: "Factorise 8x - 8", options: ["8(x-1)", "8(x+1)", "x(8-8)", "8x(1-1)"], answer: "8(x-1)" },
            { q: "Factorise 3x - 12", options: ["3(x-4)", "3(x+4)", "4(x-3)", "12(x-1)"], answer: "3(x-4)" },
            { q: "Factorise 2x - 16", options: ["2(x-8)", "2(x+8)", "8(x-2)", "2x(1-8)"], answer: "2(x-8)" },
            { q: "Factorise 7x + 35", options: ["7(x+5)", "7(x-5)", "5(x+7)", "7x(1+5)"], answer: "7(x+5)" },
            { q: "Factorise 4x - 52", options: ["4(x-13)", "4(x+13)", "13(x-4)", "4x(1-13)"], answer: "4(x-13)" },
            { q: "Factorise 7x + 91", options: ["7(x+13)", "7(x-13)", "13(x+7)", "7x(1+13)"], answer: "7(x+13)" },
            { q: "Factorise 8x + 24", options: ["8(x+3)", "8(x-3)", "3(x+8)", "8x(1+3)"], answer: "8(x+3)" },
            { q: "Factorise 6x - 72", options: ["6(x-12)", "6(x+12)", "12(x-6)", "6x(1-12)"], answer: "6(x-12)" },
            { q: "Factorise 7x - 49", options: ["7(x-7)", "7(x+7)", "49(x-1)", "7x(1-7)"], answer: "7(x-7)" },
            { q: "Factorise 2x - 22", options: ["2(x-11)", "2(x+11)", "11(x-2)", "2x(1-11)"], answer: "2(x-11)" },
            { q: "Factorise 9x + 63", options: ["9(x+7)", "9(x-7)", "7(x+9)", "9x(1+7)"], answer: "9(x+7)" },
            { q: "Factorise 5x + 30", options: ["5(x+6)", "5(x-6)", "6(x+5)", "5x(1+6)"], answer: "5(x+6)" },
            { q: "Write 0.00171 in standard form.", options: ["1.71 × 10⁻³", "1.71 × 10³", "17.1 × 10⁻⁴", "0.171 × 10⁻²"], answer: "1.71 × 10⁻³" },
            { q: "Write 0.619 in standard form.", options: ["6.19 × 10⁻¹", "6.19 × 10¹", "61.9 × 10⁻²", "0.619 × 10⁰"], answer: "6.19 × 10⁻¹" },
            { q: "Write 694000 in standard form.", options: ["6.94 × 10⁵", "6.94 × 10⁻⁵", "69.4 × 10⁴", "6.94 × 10⁶"], answer: "6.94 × 10⁵" },
            { q: "Write 8690 in standard form.", options: ["8.69 × 10³", "8.69 × 10⁻³", "86.9 × 10²", "8.69 × 10⁴"], answer: "8.69 × 10³" },
            { q: "Write 0.0035 in standard form.", options: ["3.5 × 10⁻³", "3.5 × 10³", "35 × 10⁻⁴", "0.35 × 10⁻²"], answer: "3.5 × 10⁻³" },
            { q: "Write 640000 in standard form.", options: ["6.4 × 10⁵", "6.4 × 10³", "6.4 × 10⁻⁵", "64 × 10⁴"], answer: "6.4 × 10⁵" },
            { q: "Write 0.0828 in standard form.", options: ["8.28 × 10⁻²", "8.28 × 10²", "82.8 × 10⁻³", "0.828 × 10⁻¹"], answer: "8.28 × 10⁻²" },
            { q: "Write 87100000 in standard form.", options: ["8.71 × 10⁷", "8.71 × 10⁻⁷", "87.1 × 10⁶", "8.71 × 10⁸"], answer: "8.71 × 10⁷" },
            { q: "Write 370000 in standard form.", options: ["3.7 × 10⁵", "3.7 × 10⁻⁵", "37 × 10⁴", "3.7 × 10⁶"], answer: "3.7 × 10⁵" },
            { q: "Write 0.00696 in standard form.", options: ["6.96 × 10⁻³", "6.96 × 10³", "69.6 × 10⁻⁴", "0.696 × 10⁻²"], answer: "6.96 × 10⁻³" },
            { q: "Write 4820000 in standard form.", options: ["4.82 × 10⁶", "4.82 × 10⁻⁶", "48.2 × 10⁵", "4.82 × 10⁷"], answer: "4.82 × 10⁶" },
            { q: "Write 0.0717 in standard form.", options: ["7.17 × 10⁻²", "7.17 × 10²", "71.7 × 10⁻³", "0.717 × 10⁻¹"], answer: "7.17 × 10⁻²" },
            { q: "Write 4980 in standard form.", options: ["4.98 × 10³", "4.98 × 10⁻³", "49.8 × 10²", "4.98 × 10⁴"], answer: "4.98 × 10³" },
            { q: "Write 5890 in standard form.", options: ["5.89 × 10³", "5.89 × 10⁻³", "58.9 × 10²", "5.89 × 10⁴"], answer: "5.89 × 10³" },
            { q: "Write 274000 in standard form.", options: ["2.74 × 10⁵", "2.74 × 10⁻⁵", "27.4 × 10⁴", "2.74 × 10⁶"], answer: "2.74 × 10⁵" }
        ];

        // Board layout mapping (Snakes & Ladders connections)
        const snakesAndLadders = {
            1: 38, 4: 14, 9: 31, 21: 42, 28: 84, 36: 44, 51: 67, 71: 91, 80: 100, // Ladders
            16: 6, 47: 26, 49: 11, 56: 53, 62: 19, 64: 60, 87: 24, 93: 73, 95: 75, 98: 78 // Snakes
        };

        const playerColors = ['bg-emerald-500', 'bg-cyan-500', 'bg-amber-500', 'bg-rose-500'];
        let gameState = {
            roomCode: null,
            playerName: null,
            playerId: 'p_' + Math.random().toString(36).substring(2, 7),
            players: {},
            turnOrder: [],
            currentTurnIndex: 0
        };

        let broadcastChannel = null;
        let questionTimerInterval = null;

        function buildBoard() {
            const grid = document.getElementById('board-grid');
            grid.innerHTML = '';
            
            for (let row = 9; row >= 0; row--) {
                for (let col = 0; col < 10; col++) {
                    let tileNum = (row % 2 === 1) ? row * 10 + (10 - col) : row * 10 + col + 1;

                    const tile = document.createElement('div');
                    tile.id = `tile-${tileNum}`;
                    tile.className = `border border-slate-700/50 flex flex-col justify-between p-1 text-[10px] font-mono relative ${tileNum % 2 === 0 ? 'bg-slate-800/60' : 'bg-slate-800/30'}`;
                    
                    const label = document.createElement('span');
                    label.textContent = tileNum;
                    label.className = 'text-slate-500 font-bold';
                    tile.appendChild(label);

                    if (snakesAndLadders[tileNum]) {
                        const target = snakesAndLadders[tileNum];
                        const badge = document.createElement('span');
                        badge.className = `absolute bottom-1 right-1 px-1 rounded text-[8px] font-bold ${target > tileNum ? 'bg-emerald-900/80 text-emerald-300' : 'bg-rose-900/80 text-rose-300'}`;
                        badge.textContent = target > tileNum ? `L:${target}` : `S:${target}`;
                        tile.appendChild(badge);
                    }

                    const avatarContainer = document.createElement('div');
                    avatarContainer.id = `avatars-${tileNum}`;
                    avatarContainer.className = 'flex flex-wrap gap-0.5 items-center justify-center mt-auto';
                    tile.appendChild(avatarContainer);

                    grid.appendChild(tile);
                }
            }
            drawSnakeAndLadderLines();
        }

        function drawSnakeAndLadderLines() {
            const svg = document.getElementById('board-svg');
            svg.innerHTML = '';
            
            setTimeout(() => {
                const boardRect = document.getElementById('board-grid').getBoundingClientRect();
                
                for (const [start, end] of Object.entries(snakesAndLadders)) {
                    const startEl = document.getElementById(`tile-${start}`);
                    const endEl = document.getElementById(`tile-${end}`);
                    if (!startEl || !endEl) continue;

                    const r1 = startEl.getBoundingClientRect();
                    const r2 = endEl.getBoundingClientRect();

                    const x1 = r1.left + r1.width / 2 - boardRect.left;
                    const y1 = r1.top + r1.height / 2 - boardRect.top;
                    const x2 = r2.left + r2.width / 2 - boardRect.left;
                    const y2 = r2.top + r2.height / 2 - boardRect.top;

                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', x1);
                    line.setAttribute('y1', y1);
                    line.setAttribute('x2', x2);
                    line.setAttribute('y2', y2);
                    line.setAttribute('stroke', Number(end) > Number(start) ? '#34d399' : '#f43f5e');
                    line.setAttribute('stroke-width', '3');
                    line.setAttribute('stroke-dasharray', Number(end) > Number(start) ? 'none' : '4,4');
                    svg.appendChild(line);
                }
            }, 100);
        }

        function joinGame() {
            const nameInput = document.getElementById('player-name-input').value.trim();
            const roomInput = document.getElementById('room-code-input').value.trim().toLowerCase();

            if (!nameInput || !roomInput) {
                alert('Please enter both your name and a room code!');
                return;
            }

            gameState.playerName = nameInput;
            gameState.roomCode = roomInput;

            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('display-room-code').textContent = roomInput;

            // Setup BroadcastChannel for local/multiplayer sync across tabs
            broadcastChannel = new BroadcastChannel(`math_snakes_${roomInput}`);
            broadcastChannel.onmessage = (event) => {
                syncGameState(event.data);
            };

            // Load existing room state from localStorage or create new
            let roomData = JSON.parse(localStorage.getItem(`room_${roomInput}`));
            if (!roomData) {
                roomData = {
                    players: {
                        [gameState.playerId]: { name: gameState.playerName, position: 1, colorIndex: 0 }
                    },
                    turnOrder: [gameState.playerId],
                    currentTurnIndex: 0
                };
            } else {
                if (!roomData.players[gameState.playerId]) {
                    const colorIdx = Object.keys(roomData.players).length % playerColors.length;
                    roomData.players[gameState.playerId] = { name: gameState.playerName, position: 1, colorIndex: colorIdx };
                    roomData.turnOrder.push(gameState.playerId);
                }
            }

            saveAndBroadcastState(roomData);
            logActivity(`Joined room [${roomInput}] as ${nameInput}`);
        }

        function saveAndBroadcastState(roomData) {
            localStorage.setItem(`room_${gameState.roomCode}`, JSON.stringify(roomData));
            if (broadcastChannel) {
                broadcastChannel.postMessage(roomData);
            }
            syncGameState(roomData);
        }

        function syncGameState(roomData) {
            gameState.players = roomData.players || {};
            gameState.turnOrder = roomData.turnOrder || [];
            gameState.currentTurnIndex = roomData.currentTurnIndex || 0;
            updateUI();

            const currentTurnPlayerId = gameState.turnOrder[gameState.currentTurnIndex];
            const isMyTurn = currentTurnPlayerId === gameState.playerId;
            enableTurnControls(isMyTurn);
        }

        function updateUI() {
            for (let i = 1; i <= 100; i++) {
                const container = document.getElementById(`avatars-${i}`);
                if (container) container.innerHTML = '';
            }

            const playersListEl = document.getElementById('players-list');
            playersListEl.innerHTML = '';

            let colorIdx = 0;
            for (const [pId, pData] of Object.entries(gameState.players)) {
                const pos = pData.position || 1;
                const colorClass = playerColors[pData.colorIndex !== undefined ? pData.colorIndex : (colorIdx % playerColors.length)];

                const tileAvatarContainer = document.getElementById(`avatars-${pos}`);
                if (tileAvatarContainer) {
                    const avatar = document.createElement('div');
                    avatar.className = `w-5 h-5 rounded-full ${colorClass} border-2 border-white text-[9px] font-bold flex items-center justify-center text-white shadow`;
                    avatar.title = pData.name;
                    avatar.textContent = pData.name.charAt(0).toUpperCase();
                    tileAvatarContainer.appendChild(avatar);
                }

                const pCard = document.createElement('div');
                pCard.className = `flex justify-between items-center p-2 rounded-lg bg-slate-900 border ${pId === gameState.playerId ? 'border-emerald-500' : 'border-slate-800'}`;
                pCard.innerHTML = `
                    <div class="flex items-center gap-2">
                        <div class="w-3 h-3 rounded-full ${colorClass}"></div>
                        <span class="text-xs font-semibold text-white">${pData.name} ${pId === gameState.playerId ? '(You)' : ''}</span>
                    </div>
                    <span class="text-xs font-mono text-cyan-400 font-bold">Tile ${pos}</span>
                `;
                playersListEl.appendChild(pCard);
                colorIdx++;
            }
        }

        function enableTurnControls(enable) {
            const rollBtn = document.getElementById('roll-btn');
            const indicator = document.getElementById('turn-indicator');
            if (enable) {
                rollBtn.disabled = false;
                rollBtn.classList.remove('bg-slate-700', 'text-slate-400', 'cursor-not-allowed');
                rollBtn.classList.add('bg-emerald-600', 'hover:bg-emerald-500', 'text-white', 'shadow-lg');
                indicator.textContent = "Your Turn!";
                indicator.className = "text-xs px-2.5 py-1 rounded-full bg-emerald-900 text-emerald-300 font-bold animate-pulse";
            } else {
                rollBtn.disabled = true;
                rollBtn.classList.add('bg-slate-700', 'text-slate-400', 'cursor-not-allowed');
                rollBtn.classList.remove('bg-emerald-600', 'hover:bg-emerald-500', 'text-white', 'shadow-lg');
                indicator.textContent = "Opponent's Turn";
                indicator.className = "text-xs px-2.5 py-1 rounded-full bg-cyan-900 text-cyan-300 font-bold";
            }
        }

        function rollDice() {
            const d1El = document.getElementById('dice-1');
            const d2El = document.getElementById('dice-2');
            
            d1El.classList.add('dice-shake');
            d2El.classList.add('dice-shake');

            setTimeout(() => {
                d1El.classList.remove('dice-shake');
                d2El.classList.remove('dice-shake');

                const roll1 = Math.floor(Math.random() * 6) + 1;
                const roll2 = Math.floor(Math.random() * 6) + 1;
                const totalRoll = roll1 + roll2;

                d1El.textContent = roll1;
                d2El.textContent = roll2;

                logActivity(`Rolled two dice: ${roll1} + ${roll2} = Total ${totalRoll}`);
                triggerMathChallenge(totalRoll);
            }, 600);
        }

        function triggerMathChallenge(totalRoll) {
            const qModal = document.getElementById('question-modal');
            const qText = document.getElementById('q-text');
            const qOptions = document.getElementById('q-options');
            const qTimer = document.getElementById('q-timer');

            const qObj = questionBank[Math.floor(Math.random() * questionBank.length)];
            qText.textContent = qObj.q;
            qOptions.innerHTML = '';

            let shuffledOptions = [...qObj.options].sort(() => Math.random() - 0.5);

            shuffledOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'w-full bg-slate-700 hover:bg-slate-600 border border-slate-600 text-left p-3 rounded-lg text-sm font-medium transition text-white';
                btn.textContent = opt;
                btn.onclick = () => handleAnswerSubmission(opt === qObj.answer, totalRoll);
                qOptions.appendChild(btn);
            });

            qModal.classList.remove('hidden');

            let timeLeft = 30;
            qTimer.textContent = `Time: ${timeLeft}s`;
            clearInterval(questionTimerInterval);
            questionTimerInterval = setInterval(() => {
                timeLeft--;
                qTimer.textContent = `Time: ${timeLeft}s`;
                if (timeLeft <= 0) {
                    clearInterval(questionTimerInterval);
                    handleAnswerSubmission(false, totalRoll);
                }
            }, 1000);
        }

        function handleAnswerSubmission(isCorrect, totalRoll) {
            clearInterval(questionTimerInterval);
            document.getElementById('question-modal').classList.add('hidden');

            const currentPos = gameState.players[gameState.playerId].position || 1;
            let targetPos = currentPos + totalRoll;
            if (targetPos > 100) targetPos = 100;

            if (isCorrect) {
                logActivity(`Correct answer! Moving forward ${totalRoll} steps to tile ${targetPos}.`);
                if (snakesAndLadders[targetPos]) {
                    const finalDest = snakesAndLadders[targetPos];
                    if (finalDest > targetPos) {
                        logActivity(`Nice! Landed at the base of a ladder and climbed up to tile ${finalDest}!`);
                    } else {
                        logActivity(`Saved! Correct answer prevented sliding down the snake! Staying at tile ${targetPos}.`);
                        finalizeMove(targetPos);
                        return;
                    }
                    targetPos = finalDest;
                }
                finalizeMove(targetPos);
            } else {
                logActivity(`Incorrect answer! You cannot move forward.`);
                if (snakesAndLadders[targetPos] && snakesAndLadders[targetPos] < targetPos) {
                    const snakeTail = snakesAndLadders[targetPos];
                    logActivity(`Oh no! Incorrect answer caused you to slide down the snake from ${targetPos} to ${snakeTail}!`);
                    targetPos = snakeTail;
                }
                finalizeMove(targetPos);
            }
        }

        function finalizeMove(newPos) {
            gameState.players[gameState.playerId].position = newPos;

            if (newPos === 100) {
                logActivity(`🎉 ${gameState.playerName} reached Tile 100 and won the game!`);
                confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
                alert(`Congratulations ${gameState.playerName}! You won the game!`);
            }

            const nextTurnIdx = (gameState.currentTurnIndex + 1) % gameState.turnOrder.length;
            const roomData = JSON.parse(localStorage.getItem(`room_${gameState.roomCode}`)) || {};
            roomData.players = gameState.players;
            roomData.currentTurnIndex = nextTurnIdx;

            saveAndBroadcastState(roomData);
        }

        function logActivity(message) {
            const logBox = document.getElementById('activity-log');
            const entry = document.createElement('div');
            entry.textContent = `> ${message}`;
            logBox.appendChild(entry);
            logBox.scrollTop = logBox.scrollHeight;
        }

        window.onload = () => {
            buildBoard();
        };
    </script>
</body>
</html>
